services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findoc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findoc_pass}
      POSTGRES_DB: ${POSTGRES_DB:-findoc_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findoc_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL to point at the "postgres" service by its
      # Docker Compose network hostname, not localhost — the rest of .env's values
      # (API keys, thresholds) still apply as-is.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-findoc_user}:${POSTGRES_PASSWORD:-findoc_pass}@postgres:5432/${POSTGRES_DB:-findoc_db}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Uploaded PDFs (app/services/file_storage.py) persist across container
      # restarts/rebuilds — without this volume, POST /documents/{id}/reprocess
      # would fail after any `docker compose down` that removes the container.
      - uploaded_files:/app/data/raw

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      STREAMLIT_API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  postgres_data:
  uploaded_files:
